<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">LiveDXB product thesis</title>
  <desc id="desc">Animated terminal explaining LiveDXB as a decision layer for Dubai property.</desc>
  <style>
    .frame { fill:#0d1117; stroke:#30363d; }
    .topbar { fill:#161b22; }
    .fg { fill:#f0f6fc; }
    .muted { fill:#8b949e; }
    .cyan { fill:#58a6ff; }
    .green { fill:#3fb950; }
    .red { fill:#f85149; }
    .rule { stroke:#30363d; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .t { font-size:17px; }
    .small { font-size:14px; }
    .big { font-size:22px; font-weight:700; }
    .cursor { animation: blink 1s steps(1,end) infinite; }
    @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
  </style>

  <rect x="18" y="18" width="964" height="434" rx="16" class="frame"/>
  <path d="M34 18h932a16 16 0 0 1 16 16v36H18V34a16 16 0 0 1 16-16z" class="topbar"/>
  <line x1="18" y1="70" x2="982" y2="70" class="rule"/>
  <circle cx="46" cy="44" r="7" fill="#ff5f57"/>
  <circle cx="70" cy="44" r="7" fill="#febc2e"/>
  <circle cx="94" cy="44" r="7" fill="#28c840"/>
  <text x="500" y="50" text-anchor="middle" class="small muted">alexander@dubai — ~/livedxb</text>

  <text x="48" y="108" class="t cyan">$</text>
  <text x="72" y="108" class="t fg" opacity="0">nevsky build livedxb --thesis<set attributeName="opacity" to="1" begin=".25s" fill="freeze"/></text>

  <g opacity="0">
    <set attributeName="opacity" to="1" begin=".75s" fill="freeze"/>
    <text x="48" y="154" class="big fg">LIVEDXB / DECISION LAYER</text>
  </g>

  <g opacity="0">
    <set attributeName="opacity" to="1" begin="1.05s" fill="freeze"/>
    <text x="48" y="190" class="small red">× not a listings website</text>
    <text x="300" y="190" class="small red">× not an agent brochure</text>
  </g>

  <line x1="48" y1="212" x2="952" y2="212" class="rule" opacity="0">
    <set attributeName="opacity" to="1" begin="1.25s" fill="freeze"/>
  </line>

  <g opacity="0">
    <set attributeName="opacity" to="1" begin="1.50s" fill="freeze"/>
    <text x="48" y="247" class="small muted">INPUTS</text>
    <text x="168" y="247" class="small fg">communities</text>
    <text x="315" y="247" class="small fg">buildings</text>
    <text x="435" y="247" class="small fg">service charges</text>
    <text x="615" y="247" class="small fg">schools</text>
    <text x="168" y="275" class="small fg">routes</text>
    <text x="315" y="275" class="small fg">supply</text>
    <text x="435" y="275" class="small fg">liquidity</text>
  </g>

  <g opacity="0">
    <set attributeName="opacity" to="1" begin="1.90s" fill="freeze"/>
    <text x="48" y="318" class="small muted">PROCESS</text>
    <text x="168" y="318" class="small cyan">editorial research + structured knowledge + market data + buying logic</text>
  </g>

  <g opacity="0">
    <set attributeName="opacity" to="1" begin="2.30s" fill="freeze"/>
    <text x="48" y="359" class="small muted">PRODUCTION</text>
    <text x="168" y="359" class="small fg">Astro</text>
    <text x="260" y="359" class="small fg">→</text>
    <text x="300" y="359" class="small fg">Cloudflare Pages</text>
    <text x="475" y="359" class="small fg">+</text>
    <text x="505" y="359" class="small fg">origin Worker</text>
    <text x="670" y="359" class="small green">● LIVE</text>
  </g>

  <line x1="48" y1="386" x2="952" y2="386" class="rule" opacity="0">
    <set attributeName="opacity" to="1" begin="2.55s" fill="freeze"/>
  </line>

  <g opacity="0">
    <set attributeName="opacity" to="1" begin="2.80s" fill="freeze"/>
    <text x="48" y="426" class="small muted">OUTPUT</text>
    <text x="168" y="426" class="t green">practical decision intelligence for Dubai property</text>
    <rect x="668" y="412" width="8" height="18" rx="1" class="green cursor"/>
  </g>
</svg>