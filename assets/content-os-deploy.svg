<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">Content OS deployment animation</title>
  <desc id="desc">Animated terminal showing a three-tenant Astro publishing system deploying through Cloudflare.</desc>
  <style>
    .frame { fill:#0d1117; stroke:#30363d; }
    .topbar { fill:#161b22; }
    .fg { fill:#f0f6fc; }
    .muted { fill:#8b949e; }
    .cyan { fill:#58a6ff; }
    .green { fill:#3fb950; }
    .yellow { fill:#d29922; }
    .barbg { fill:#21262d; }
    .rule { stroke:#30363d; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .t { font-size:17px; }
    .small { font-size:14px; }
    .bold { font-size:17px; font-weight:700; }
    .cursor { animation: blink 1s steps(1,end) infinite; }
    @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
  </style>

  <rect x="18" y="18" width="964" height="504" rx="16" class="frame"/>
  <path d="M34 18h932a16 16 0 0 1 16 16v36H18V34a16 16 0 0 1 16-16z" class="topbar"/>
  <line x1="18" y1="70" x2="982" y2="70" class="rule"/>
  <circle cx="46" cy="44" r="7" fill="#ff5f57"/>
  <circle cx="70" cy="44" r="7" fill="#febc2e"/>
  <circle cx="94" cy="44" r="7" fill="#28c840"/>
  <text x="500" y="50" text-anchor="middle" class="small muted">alexander@dubai — ~/content-os</text>

  <text x="48" y="108" class="t cyan">$</text>
  <g class="t fg">
    <text x="72" y="108" opacity="0">nevsky deploy content-os --production
      <set attributeName="opacity" to="1" begin=".35s" fill="freeze"/>
    </text>
  </g>

  <g opacity="0"><set attributeName="opacity" to="1" begin=".85s" fill="freeze"/>
    <text x="48" y="145" class="small muted">source</text><text x="145" y="145" class="small fg">local Ghost / reviewed revisions</text>
  </g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="1.10s" fill="freeze"/>
    <text x="48" y="171" class="small muted">canonical</text><text x="145" y="171" class="small fg">Git / multilingual content</text>
  </g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="1.35s" fill="freeze"/>
    <text x="48" y="197" class="small muted">renderer</text><text x="145" y="197" class="small fg">Astro</text>
  </g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="1.60s" fill="freeze"/>
    <text x="48" y="223" class="small muted">edge</text><text x="145" y="223" class="small fg">Cloudflare</text>
  </g>

  <g opacity="0"><set attributeName="opacity" to="1" begin="1.95s" fill="freeze"/>
    <text x="48" y="265" class="bold fg">building tenants</text>
  </g>

  <g opacity="0"><set attributeName="opacity" to="1" begin="2.20s" fill="freeze"/>
    <text x="48" y="300" class="small fg">nevsky.ae</text>
    <rect x="210" y="287" width="560" height="12" rx="6" class="barbg"/>
    <rect x="210" y="287" width="0" height="12" rx="6" class="cyan"><animate attributeName="width" from="0" to="560" dur="1.1s" begin="2.30s" fill="freeze"/></rect>
    <text x="795" y="300" class="small green" opacity="0">100% <set attributeName="opacity" to="1" begin="3.40s" fill="freeze"/></text>
  </g>

  <g opacity="0"><set attributeName="opacity" to="1" begin="2.45s" fill="freeze"/>
    <text x="48" y="333" class="small fg">livedxb.com</text>
    <rect x="210" y="320" width="560" height="12" rx="6" class="barbg"/>
    <rect x="210" y="320" width="0" height="12" rx="6" class="cyan"><animate attributeName="width" from="0" to="560" dur="1.15s" begin="2.55s" fill="freeze"/></rect>
    <text x="795" y="333" class="small green" opacity="0">100% <set attributeName="opacity" to="1" begin="3.70s" fill="freeze"/></text>
  </g>

  <g opacity="0"><set attributeName="opacity" to="1" begin="2.70s" fill="freeze"/>
    <text x="48" y="366" class="small fg">nevskii.me</text>
    <rect x="210" y="353" width="560" height="12" rx="6" class="barbg"/>
    <rect x="210" y="353" width="0" height="12" rx="6" class="cyan"><animate attributeName="width" from="0" to="560" dur="1.2s" begin="2.80s" fill="freeze"/></rect>
    <text x="795" y="366" class="small green" opacity="0">100% <set attributeName="opacity" to="1" begin="4.00s" fill="freeze"/></text>
  </g>

  <line x1="48" y1="393" x2="948" y2="393" class="rule" opacity="0"><set attributeName="opacity" to="1" begin="4.18s" fill="freeze"/></line>

  <g opacity="0"><set attributeName="opacity" to="1" begin="4.35s" fill="freeze"/>
    <text x="48" y="425" class="small muted">Pages</text><text x="140" y="425" class="small green">● READY</text>
    <text x="280" y="425" class="small muted">Workers</text><text x="388" y="425" class="small green">● READY</text>
    <text x="535" y="425" class="small muted">R2</text><text x="590" y="425" class="small green">● READY</text>
    <text x="720" y="425" class="small muted">DNS/CDN</text><text x="822" y="425" class="small green">● READY</text>
  </g>

  <g opacity="0"><set attributeName="opacity" to="1" begin="4.75s" fill="freeze"/>
    <text x="48" y="466" class="t green">✓ 3 publications deployed from one engine</text>
  </g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="5.05s" fill="freeze"/>
    <text x="48" y="496" class="small fg">one architecture · three identities · zero blind cross-posting</text>
    <rect x="598" y="483" width="8" height="17" rx="1" class="green cursor"/>
  </g>
</svg>
