<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Alexander Nevsky — animated terminal profile</title>
  <desc id="desc">A terminal animation introducing Alexander Nevsky as an AI Product Designer and Builder in Dubai.</desc>
  <style>
    .frame { fill:#0d1117; stroke:#30363d; }
    .topbar { fill:#161b22; }
    .fg { fill:#f0f6fc; }
    .muted { fill:#8b949e; }
    .cyan { fill:#58a6ff; }
    .green { fill:#3fb950; }
    .yellow { fill:#d29922; }
    .rule { stroke:#30363d; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .t { font-size:18px; }
    .small { font-size:15px; }
    .big { font-size:25px; font-weight:700; letter-spacing:.2px; }
    .cursor { animation: blink 1s steps(1,end) infinite; }
    @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
  </style>

  <rect x="18" y="18" width="964" height="394" rx="16" class="frame"/>
  <path d="M34 18h932a16 16 0 0 1 16 16v36H18V34a16 16 0 0 1 16-16z" class="topbar"/>
  <line x1="18" y1="70" x2="982" y2="70" class="rule"/>
  <circle cx="46" cy="44" r="7" fill="#ff5f57"/>
  <circle cx="70" cy="44" r="7" fill="#febc2e"/>
  <circle cx="94" cy="44" r="7" fill="#28c840"/>
  <text x="500" y="50" text-anchor="middle" class="small muted">alexander@dubai — ~/systems</text>

  <text x="52" y="112" class="t cyan">$</text>
  <g class="t fg">
    <text x="76" y="112" opacity="0">n<set attributeName="opacity" to="1" begin=".10s" fill="freeze"/></text>
    <text x="87" y="112" opacity="0">e<set attributeName="opacity" to="1" begin=".16s" fill="freeze"/></text>
    <text x="98" y="112" opacity="0">v<set attributeName="opacity" to="1" begin=".22s" fill="freeze"/></text>
    <text x="109" y="112" opacity="0">s<set attributeName="opacity" to="1" begin=".28s" fill="freeze"/></text>
    <text x="120" y="112" opacity="0">k<set attributeName="opacity" to="1" begin=".34s" fill="freeze"/></text>
    <text x="131" y="112" opacity="0">y<set attributeName="opacity" to="1" begin=".40s" fill="freeze"/></text>
    <text x="142" y="112" opacity="0"> <set attributeName="opacity" to="1" begin=".46s" fill="freeze"/></text>
    <text x="153" y="112" opacity="0">s<set attributeName="opacity" to="1" begin=".52s" fill="freeze"/></text>
    <text x="164" y="112" opacity="0">t<set attributeName="opacity" to="1" begin=".58s" fill="freeze"/></text>
    <text x="175" y="112" opacity="0">a<set attributeName="opacity" to="1" begin=".64s" fill="freeze"/></text>
    <text x="186" y="112" opacity="0">t<set attributeName="opacity" to="1" begin=".70s" fill="freeze"/></text>
    <text x="197" y="112" opacity="0">u<set attributeName="opacity" to="1" begin=".76s" fill="freeze"/></text>
    <text x="208" y="112" opacity="0">s<set attributeName="opacity" to="1" begin=".82s" fill="freeze"/></text>
  </g>

  <g opacity="0">
    <set attributeName="opacity" to="1" begin="1.05s" fill="freeze"/>
    <text x="52" y="158" class="big fg">ALEXANDER NEVSKY</text>
  </g>
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="1.28s" fill="freeze"/>
    <text x="52" y="188" class="t fg">AI Product Designer &amp; Builder</text>
  </g>

  <g opacity="0">
    <set attributeName="opacity" to="1" begin="1.60s" fill="freeze"/>
    <text x="52" y="234" class="small muted">location</text>
    <text x="168" y="234" class="small fg">Dubai, UAE</text>
    <text x="500" y="234" class="small muted">runtime</text>
    <text x="616" y="234" class="small fg">human + AI agents</text>
  </g>
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="1.90s" fill="freeze"/>
    <text x="52" y="263" class="small muted">focus</text>
    <text x="168" y="263" class="small fg">products / systems / automation</text>
    <text x="500" y="263" class="small muted">infra</text>
    <text x="616" y="263" class="small fg">GitHub + Cloudflare</text>
  </g>
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="2.20s" fill="freeze"/>
    <text x="52" y="292" class="small muted">state</text>
    <text x="168" y="292" class="small green">● SHIPPING</text>
  </g>

  <line x1="52" y1="320" x2="948" y2="320" class="rule" opacity="0">
    <set attributeName="opacity" to="1" begin="2.45s" fill="freeze"/>
  </line>

  <g opacity="0">
    <set attributeName="opacity" to="1" begin="2.75s" fill="freeze"/>
    <text x="52" y="356" class="t cyan">$</text>
    <text x="76" y="356" class="t fg">systems --active</text>
  </g>
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="3.12s" fill="freeze"/>
    <text x="52" y="388" class="small fg">7 systems</text>
    <text x="170" y="388" class="small muted">·</text>
    <text x="191" y="388" class="small fg">1 open source</text>
    <text x="336" y="388" class="small muted">·</text>
    <text x="357" y="388" class="small green">building continuously</text>
    <rect x="566" y="374" width="9" height="18" class="green cursor" rx="1"/>
  </g>
</svg>
